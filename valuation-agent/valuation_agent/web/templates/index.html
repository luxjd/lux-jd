<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valuation Agent — Upload Vehicle</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Valuation Agent</h1>
            <p class="subtitle">Upload Vehicle &rarr; Get German Market Price</p>
        </header>

        <form id="valuation-form" action="/api/v1/valuate" method="POST" enctype="multipart/form-data">
            <div class="form-grid">
                <!-- Required Fields -->
                <div class="form-group">
                    <label for="make">Make *</label>
                    <select name="make" id="make" required>
                        <option value="">Select brand...</option>
                        <option value="Ferrari">Ferrari</option>
                        <option value="Mercedes-AMG">Mercedes-AMG</option>
                        <option value="Porsche">Porsche</option>
                        <option value="Jaguar">Jaguar</option>
                        <option value="Bentley">Bentley</option>
                        <option value="Aston Martin">Aston Martin</option>
                        <option value="Lamborghini">Lamborghini</option>
                        <option value="Maserati">Maserati</option>
                        <option value="BMW M">BMW M</option>
                        <option value="Range Rover">Range Rover</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="model">Model *</label>
                    <input type="text" name="model" id="model" placeholder="e.g. 488 GTB" required>
                </div>

                <div class="form-group">
                    <label for="year">Year *</label>
                    <input type="number" name="year" id="year" min="1990" max="2026" required>
                </div>

                <div class="form-group">
                    <label for="mileage_km">Mileage (km) *</label>
                    <input type="number" name="mileage_km" id="mileage_km" min="0" required>
                </div>

                <div class="form-group">
                    <label for="drive_side">Drive Side *</label>
                    <select name="drive_side" id="drive_side" required>
                        <option value="LHD">LHD (Left-Hand Drive)</option>
                        <option value="RHD">RHD (Right-Hand Drive)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="asking_price_jpy">Asking Price (JPY) *</label>
                    <input type="number" name="asking_price_jpy" id="asking_price_jpy" min="1" required>
                </div>

                <div class="form-group">
                    <label for="exterior_color">Exterior Color *</label>
                    <input type="text" name="exterior_color" id="exterior_color" placeholder="e.g. Rosso Corsa" required>
                </div>

                <div class="form-group">
                    <label for="interior_color">Interior Color</label>
                    <input type="text" name="interior_color" id="interior_color" placeholder="e.g. Nero leather">
                </div>

                <!-- Optional Fields -->
                <div class="form-group">
                    <label for="service_history">Service History</label>
                    <select name="service_history" id="service_history">
                        <option value="UNKNOWN">Unknown</option>
                        <option value="FULL_DEALER">Full Dealer</option>
                        <option value="PARTIAL_DEALER">Partial Dealer</option>
                        <option value="INDEPENDENT">Independent</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="auction_grade">Auction Grade (1.0–6.5)</label>
                    <input type="number" name="auction_grade" id="auction_grade" min="1.0" max="6.5" step="0.5">
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" name="accident_history" value="true">
                        Known Accident History
                    </label>
                </div>

                <div class="form-group full-width">
                    <label for="specification_notes">Specification Notes</label>
                    <textarea name="specification_notes" id="specification_notes" rows="3" placeholder="Carbon ceramic brakes, sport exhaust, full PPF..."></textarea>
                </div>

                <!-- File Uploads -->
                <div class="form-group full-width">
                    <label for="photos">Vehicle Photos (up to 30)</label>
                    <input type="file" name="photos" id="photos" multiple accept="image/*">
                    <small>JPG/PNG. Drag & drop supported.</small>
                </div>

                <div class="form-group full-width">
                    <label for="auction_sheet">Auction Inspection Sheet</label>
                    <input type="file" name="auction_sheet" id="auction_sheet" accept="image/*,.pdf">
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                <span class="btn-text">Run Valuation</span>
                <span class="btn-spinner hidden">Processing...</span>
            </button>
        </form>

        <div id="result" class="result-panel hidden"></div>
    </div>

    <script>
        document.getElementById('valuation-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const resultPanel = document.getElementById('result');

            btn.querySelector('.btn-text').classList.add('hidden');
            btn.querySelector('.btn-spinner').classList.remove('hidden');
            btn.disabled = true;
            resultPanel.classList.add('hidden');

            try {
                const formData = new FormData(e.target);
                const response = await fetch('/api/v1/valuate', { method: 'POST', body: formData });
                const data = await response.json();

                const rec = data.recommendation;
                const margin = data.margin_analysis;
                const cost = data.landed_cost;

                let verdictClass = 'verdict-pass';
                if (rec.verdict === 'BUY') verdictClass = 'verdict-buy';
                else if (rec.verdict === 'REVIEW') verdictClass = 'verdict-review';

                resultPanel.innerHTML = `
                    <h2>Valuation Report</h2>
                    <div class="verdict ${verdictClass}">${rec.verdict}</div>
                    <p class="reasoning">${rec.verdict_reasoning}</p>
                    <div class="metrics">
                        <div class="metric">
                            <span class="label">Sale Price (DE)</span>
                            <span class="value">€${Number(margin.estimated_sale_price).toLocaleString()}</span>
                        </div>
                        <div class="metric">
                            <span class="label">Landed Cost</span>
                            <span class="value">€${Number(cost.total_landed_cost_eur).toLocaleString()}</span>
                        </div>
                        <div class="metric">
                            <span class="label">Gross Margin</span>
                            <span class="value">€${Number(margin.gross_margin_eur).toLocaleString()} (${Number(margin.gross_margin_pct).toFixed(1)}%)</span>
                        </div>
                        ${rec.max_bid_jpy ? `<div class="metric"><span class="label">Max Bid</span><span class="value">¥${Number(rec.max_bid_jpy).toLocaleString()}</span></div>` : ''}
                    </div>
                    <details><summary>Full JSON Report</summary><pre>${JSON.stringify(data, null, 2)}</pre></details>
                `;
                resultPanel.classList.remove('hidden');
            } catch (err) {
                resultPanel.innerHTML = `<div class="error">Error: ${err.message}</div>`;
                resultPanel.classList.remove('hidden');
            } finally {
                btn.querySelector('.btn-text').classList.remove('hidden');
                btn.querySelector('.btn-spinner').classList.add('hidden');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
